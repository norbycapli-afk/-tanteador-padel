<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel Scoreboard - Overlay vMix</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 60px;
  }

  .scoreboard {
    display: flex;
    align-items: stretch;
    height: 90px;
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.55));
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .scoreboard.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .team-block {
    display: flex;
    align-items: center;
    background: rgba(10,10,18,0.92);
    backdrop-filter: blur(8px);
    padding: 0 28px;
    min-width: 340px;
    gap: 18px;
    position: relative;
    overflow: hidden;
  }

  .team-block::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: #00D4AA;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .team-block.serving::before {
    opacity: 1;
  }

  .team-block:first-child {
    border-radius: 8px 0 0 8px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }

  .serve-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #FFE500;
    box-shadow: 0 0 8px #FFE500;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .team-block.serving .serve-dot {
    opacity: 1;
  }

  .team-name {
    font-size: 28px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
    flex: 1;
    min-width: 180px;
  }

  .sets-container {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .set-score {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    width: 26px;
    text-align: center;
    transition: color 0.3s;
  }

  .set-score.won {
    color: #00D4AA;
  }

  .set-score.current-set {
    color: rgba(255,255,255,0.85);
  }

  .divider {
    width: 80px;
    background: #00D4AA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .divider-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(0,0,0,0.6);
    text-transform: uppercase;
  }

  .divider-sport {
    font-size: 22px;
  }

  .game-score-block {
    background: rgba(0,212,170,0.12);
    border-left: 1px solid rgba(0,212,170,0.3);
    border-right: 1px solid rgba(0,212,170,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    gap: 2px;
    flex-shrink: 0;
  }

  .game-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
  }

  .game-scores {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .game-num {
    font-size: 42px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1;
    min-width: 32px;
    text-align: center;
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .game-num.bump {
    transform: scale(1.25);
    color: #FFE500;
  }

  .game-separator {
    font-size: 28px;
    font-weight: 400;
    color: rgba(255,255,255,0.25);
  }

  .team-block-right {
    border-radius: 0 8px 8px 0;
    border-left: 1px solid rgba(255,255,255,0.08);
    flex-direction: row-reverse;
  }

  .team-block-right .team-name {
    text-align: right;
  }

  .team-block-right .sets-container {
    flex-direction: row-reverse;
  }

  .set-won-indicator {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .set-pip {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.3s;
  }

  .set-pip.won {
    background: #00D4AA;
  }

  .tiebreak-badge {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: #FFE500;
    color: #000;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .tiebreak-badge.visible {
    opacity: 1;
  }

  .match-over-banner {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s;
  }

  .match-over-banner.visible {
    opacity: 1;
  }

  .match-over-text {
    font-size: 80px;
    font-weight: 900;
    color: #FFE500;
    text-transform: uppercase;
    letter-spacing: 8px;
    text-shadow: 0 0 40px rgba(255,229,0,0.5);
  }
</style>
</head>
<body>

<div class="scoreboard" id="scoreboard">
  <div class="team-block" id="team1-block">
    <span class="serve-dot" id="serve1"></span>
    <span class="team-name" id="team1-name">EQUIPO 1</span>
    <div class="sets-container" id="sets1"></div>
    <div class="set-won-indicator" id="pips1"></div>
  </div>

  <div class="game-score-block" style="position:relative;">
    <span class="tiebreak-badge" id="tiebreak-badge">TIEBREAK</span>
    <div class="game-label">GAMES</div>
    <div class="game-scores">
      <span class="game-num" id="g1">0</span>
      <span class="game-separator">—</span>
      <span class="game-num" id="g2">0</span>
    </div>
  </div>

  <div class="team-block team-block-right" id="team2-block">
    <span class="serve-dot" id="serve2"></span>
    <span class="team-name" id="team2-name">EQUIPO 2</span>
    <div class="sets-container" id="sets2"></div>
    <div class="set-won-indicator" id="pips2"></div>
  </div>
</div>

<div class="match-over-banner" id="match-over">
  <span class="match-over-text" id="match-over-text">FIN DEL PARTIDO</span>
</div>

<script>
const MAX_SETS = 3;

let state = {
  team1: 'EQUIPO 1',
  team2: 'EQUIPO 2',
  games1: 0,
  games2: 0,
  sets1: [],
  sets2: [],
  serving: 1,
  visible: true,
  tiebreak: false,
  matchOver: false,
  winner: ''
};

function renderSets(container1, container2, pips1el, pips2el) {
  const maxSets = MAX_SETS;
  container1.innerHTML = '';
  container2.innerHTML = '';
  pips1el.innerHTML = '';
  pips2el.innerHTML = '';

  for (let i = 0; i < maxSets; i++) {
    const s1 = document.createElement('span');
    const s2 = document.createElement('span');
    s1.className = 'set-score';
    s2.className = 'set-score';

    if (i < state.sets1.length) {
      s1.textContent = state.sets1[i];
      s2.textContent = state.sets2[i];
      if (state.sets1[i] > state.sets2[i]) s1.classList.add('won');
      if (state.sets2[i] > state.sets1[i]) s2.classList.add('won');
    } else if (i === state.sets1.length) {
      s1.textContent = '·';
      s2.textContent = '·';
      s1.classList.add('current-set');
      s2.classList.add('current-set');
    } else {
      s1.textContent = '·';
      s2.textContent = '·';
    }
    container1.appendChild(s1);
    container2.appendChild(s2);
  }

  const sets1Won = state.sets1.filter((s,i) => s > state.sets2[i]).length;
  const sets2Won = state.sets2.filter((s,i) => s > state.sets1[i]).length;

  for (let i = 0; i < Math.ceil(maxSets/2); i++) {
    const p1 = document.createElement('div');
    const p2 = document.createElement('div');
    p1.className = 'set-pip' + (i < sets1Won ? ' won' : '');
    p2.className = 'set-pip' + (i < sets2Won ? ' won' : '');
    pips1el.appendChild(p1);
    pips2el.appendChild(p2);
  }
}

function bump(id) {
  const el = document.getElementById(id);
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 300);
}

function render() {
  document.getElementById('team1-name').textContent = state.team1.toUpperCase();
  document.getElementById('team2-name').textContent = state.team2.toUpperCase();
  document.getElementById('g1').textContent = state.games1;
  document.getElementById('g2').textContent = state.games2;

  renderSets(
    document.getElementById('sets1'),
    document.getElementById('sets2'),
    document.getElementById('pips1'),
    document.getElementById('pips2')
  );

  document.getElementById('team1-block').classList.toggle('serving', state.serving === 1);
  document.getElementById('team2-block').classList.toggle('serving', state.serving === 2);
  document.getElementById('serve1').style.opacity = state.serving === 1 ? '1' : '0';
  document.getElementById('serve2').style.opacity = state.serving === 2 ? '1' : '0';

  document.getElementById('tiebreak-badge').classList.toggle('visible', state.tiebreak);
  document.getElementById('scoreboard').classList.toggle('visible', state.visible);
  document.getElementById('match-over').classList.toggle('visible', state.matchOver);
  if (state.matchOver && state.winner) {
    document.getElementById('match-over-text').textContent = '🏆 ' + state.winner.toUpperCase() + ' GANA';
  }
}

function applyState(newState) {
  const prev = { g1: state.games1, g2: state.games2 };
  state = { ...state, ...newState };
  if (state.games1 !== prev.g1) bump('g1');
  if (state.games2 !== prev.g2) bump('g2');
  render();
}

// BroadcastChannel para recibir del panel de control (mismo dominio)
const bc = new BroadcastChannel('padel_scoreboard');
bc.onmessage = (e) => {
  if (e.data && e.data.type === 'STATE_UPDATE') {
    applyState(e.data.state);
  }
};

// localStorage sync (fallback y para vMix Web Browser)
function checkStorage() {
  try {
    const raw = localStorage.getItem('padel_state');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed._ts !== state._ts) {
        applyState(parsed);
      }
    }
  } catch(e) {}
}
setInterval(checkStorage, 300);

window.addEventListener('storage', (e) => {
  if (e.key === 'padel_state' && e.newValue) {
    try { applyState(JSON.parse(e.newValue)); } catch(e) {}
  }
});

render();
</script>
</body>
</html>
