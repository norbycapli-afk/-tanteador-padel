<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow Condensed', Arial, sans-serif; background: transparent; padding: 24px; }

  .overlay {
    width: 780px;
    background: linear-gradient(135deg, rgba(10,10,20,0.95) 0%, rgba(20,20,40,0.92) 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    background: linear-gradient(90deg, rgba(220,30,40,0.9), rgba(180,20,30,0.85));
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo-area { display: flex; align-items: center; min-width: 60px; }
  .logo-img { height: 32px; max-width: 120px; object-fit: contain; display: none; }
  .logo-ph { width: 32px; height: 32px; background: rgba(255,255,255,0.15); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .tournament-name { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; text-align: center; flex: 1; }
  .time-area { display: flex; align-items: center; gap: 8px; min-width: 80px; justify-content: flex-end; }
  .live-pill { display: none; align-items: center; gap: 5px; background: rgba(0,0,0,0.35); border-radius: 20px; padding: 3px 9px; font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .live-pill.on { display: flex; }
  .live-dot { width: 7px; height: 7px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }
  .match-time { color: #fff; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }

  .tb-badge { display: none; text-align: center; background: linear-gradient(90deg,rgba(168,85,247,0.3),rgba(139,92,246,0.2)); color: #d8b4fe; font-size: 11px; font-weight: 800; letter-spacing: 3px; padding: 5px 0; border-bottom: 1px solid rgba(168,85,247,0.3); }

  .scoreboard { padding: 10px 16px 14px; }
  .col-headers { display: grid; grid-template-columns: 1fr 44px 44px 44px 72px 86px; gap: 4px; padding: 0 8px 6px; }
  .col-headers span { text-align: center; color: rgba(255,255,255,0.28); font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

  .team-rows { display: flex; flex-direction: column; gap: 5px; }
  .team-row { display: grid; grid-template-columns: 1fr 44px 44px 44px 72px 86px; align-items: center; gap: 4px; padding: 10px 8px; border-radius: 9px; border: 1px solid transparent; transition: all 0.25s; }
  .team-row.serving { background: rgba(255,255,255,0.055); border-color: rgba(255,255,255,0.07); }

  .name-wrap { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .serving-indicator { width: 4px; height: 32px; border-radius: 2px; background: #dc1e28; flex-shrink: 0; opacity: 0; transition: opacity 0.2s; }
  .team-row.serving .serving-indicator { opacity: 1; }
  .team-name { color: #fff; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }

  .set-cell { text-align: center; color: rgba(255,255,255,0.3); font-size: 18px; font-weight: 700; padding: 4px 0; border-radius: 5px; transition: all 0.3s; }
  .set-cell.won { color: #fff; font-size: 20px; }
  .set-cell.cur { color: rgba(255,255,255,0.65); font-size: 20px; }

  .game-cell { text-align: center; color: #fff; font-size: 34px; font-weight: 900; background: rgba(255,255,255,0.07); border-radius: 7px; padding: 5px 0; font-variant-numeric: tabular-nums; letter-spacing: -1px; transition: all 0.2s; }
  .game-cell.flash { animation: flashGame 0.4s ease; }
  @keyframes flashGame { 0%{background:rgba(240,192,64,0.5);transform:scale(1.08)}100%{background:rgba(255,255,255,0.07);transform:scale(1)} }

  .point-cell { text-align: center; font-size: 28px; font-weight: 900; border-radius: 7px; padding: 5px 0; transition: all 0.2s; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
  .point-cell.normal { color: #f0c040; background: rgba(240,192,64,0.1); border-color: rgba(240,192,64,0.2); }
  .point-cell.oro { color: #fff; background: linear-gradient(135deg,rgba(240,192,64,0.4),rgba(220,160,30,0.3)); border-color: rgba(240,192,64,0.5); font-size: 20px; letter-spacing: 1px; animation: pulseOro 1.2s infinite; }
  @keyframes pulseOro { 0%,100%{box-shadow:0 0 0 0 rgba(240,192,64,0.4)}50%{box-shadow:0 0 0 6px rgba(240,192,64,0)} }
  .point-cell.tb { color: #d8b4fe; background: rgba(168,85,247,0.12); border-color: rgba(168,85,247,0.3); }
  .point-cell.flash { animation: flashPt 0.35s ease; }
  @keyframes flashPt { 0%{transform:scale(1.12)}100%{transform:scale(1)} }

  .team-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0 8px; }

  /* QR overlay opcional */
  .qr-box { position: fixed; bottom: 20px; right: 20px; background: #fff; padding: 8px; border-radius: 10px; display: none; }
  .qr-box img { width: 80px; height: 80px; display: block; }
  .qr-label { text-align: center; font-size: 9px; font-weight: 800; color: #333; letter-spacing: 1px; margin-top: 4px; }
</style>
</head>
<body>
<div class="overlay">
  <div class="top-bar">
    <div class="logo-area">
      <img class="logo-img" id="logo-img" src="" alt="logo">
      <div class="logo-ph" id="logo-ph">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.4)" stroke-width="2"/></svg>
      </div>
    </div>
    <div class="tournament-name" id="disp-tournament">TORNEO PADEL TV</div>
    <div class="time-area">
      <div class="live-pill" id="live-pill"><span class="live-dot"></span>LIVE</div>
      <div class="match-time" id="disp-time">00:00</div>
    </div>
  </div>
  <div class="tb-badge" id="tb-badge">⬡ &nbsp; TIE — BREAK &nbsp; ⬡</div>
  <div class="scoreboard">
    <div class="col-headers">
      <span></span><span>S1</span><span>S2</span><span>S3</span><span>GAME</span><span>PUNTO</span>
    </div>
    <div class="team-rows">
      <div class="team-row serving" id="row-0">
        <div class="name-wrap"><div class="serving-indicator"></div><div class="team-name" id="disp-name-0">PAREJA 1</div></div>
        <div class="set-cell cur" id="s0-0">-</div><div class="set-cell" id="s1-0">-</div><div class="set-cell" id="s2-0">-</div>
        <div class="game-cell" id="g-0">0</div><div class="point-cell normal" id="p-0">0</div>
      </div>
      <div class="team-divider"></div>
      <div class="team-row" id="row-1">
        <div class="name-wrap"><div class="serving-indicator"></div><div class="team-name" id="disp-name-1">PAREJA 2</div></div>
        <div class="set-cell cur" id="s0-1">-</div><div class="set-cell" id="s1-1">-</div><div class="set-cell" id="s2-1">-</div>
        <div class="game-cell" id="g-1">0</div><div class="point-cell normal" id="p-1">0</div>
      </div>
    </div>
  </div>
</div>

<!-- QR opcional -->
<div class="qr-box" id="qr-box">
  <img id="qr-img" src="" alt="QR">
  <div class="qr-label">SEGUÍ EN VIVO</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLmCZqYxGnheevtj4aY5s3X73FumaW-zc",
  authDomain: "tanteador-padel.firebaseapp.com",
  databaseURL: "https://tanteador-padel-default-rtdb.firebaseio.com",
  projectId: "tanteador-padel",
  storageBucket: "tanteador-padel.firebasestorage.app",
  messagingSenderId: "491608542765",
  appId: "1:491608542765:web:fb42fb877a72ae712d32a4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const PTS = ['0','15','30','40'];
let timerInt = null;
let prevPts = [0,0], prevGames = [0,0], prevTb = false;

function flash(id){ const el=document.getElementById(id); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),500); }

// Cancha desde URL param ?cancha=1
const cancha = new URLSearchParams(location.search).get('cancha')||'1';
const dbPath = 'cancha'+cancha+'/estado';

onValue(ref(db, dbPath), snap => {
  const st = snap.val(); if(!st) return;

  document.getElementById('disp-tournament').textContent=(st.tournament||'TORNEO PADEL TV').toUpperCase();

  // Logo
  const li=document.getElementById('logo-img'), lp=document.getElementById('logo-ph');
  if(st.logoUrl){ li.src=st.logoUrl; li.style.display='block'; lp.style.display='none'; }
  else { li.style.display='none'; lp.style.display='flex'; }

  // QR
  const qrBox=document.getElementById('qr-box');
  if(st.qrUrl){ document.getElementById('qr-img').src=st.qrUrl; qrBox.style.display='block'; }
  else { qrBox.style.display='none'; }

  // Timer
  clearInterval(timerInt);
  if(st.timerRunning){
    const base=st.timerBase||0, started=st.timerStarted||Date.now();
    const upd=()=>{ const e=base+Math.floor((Date.now()-started)/1000); document.getElementById('disp-time').textContent=Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0'); };
    upd(); timerInt=setInterval(upd,500);
    document.getElementById('live-pill').className='live-pill on';
  } else {
    const s=st.timerBase||0; document.getElementById('disp-time').textContent=Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');
    document.getElementById('live-pill').className='live-pill';
  }

  document.getElementById('disp-name-0').textContent=(st.names&&st.names[0])||'PAREJA 1';
  document.getElementById('disp-name-1').textContent=(st.names&&st.names[1])||'PAREJA 2';
  const srv=st.serving||0;
  document.getElementById('row-0').className='team-row'+(srv===0?' serving':'');
  document.getElementById('row-1').className='team-row'+(srv===1?' serving':'');
  document.getElementById('tb-badge').style.display=st.tiebreak?'block':'none';

  const sets=st.sets||[null,null,null], curSet=st.curSet||0;
  const games=st.games||[0,0], tbPts=st.tbPts||[0,0], pts=st.pts||[0,0];

  for(let t=0;t<2;t++){
    for(let s=0;s<3;s++){
      const el=document.getElementById('s'+s+'-'+t);
      if(sets[s]){ el.textContent=sets[s][t]; el.className='set-cell'+(sets[s][t]>sets[s][1-t]?' won':''); }
      else if(s===curSet){ el.textContent=games[t]; el.className='set-cell cur'; }
      else { el.textContent='-'; el.className='set-cell'; }
    }
    const dg=st.tiebreak?tbPts[t]:games[t];
    if(dg!==prevGames[t]){ flash('g-'+t); } prevGames[t]=dg;
    document.getElementById('g-'+t).textContent=dg;

    const pEl=document.getElementById('p-'+t);
    if(st.tiebreak){
      if(tbPts[t]!==prevPts[t]) flash('p-'+t); prevPts[t]=tbPts[t];
      pEl.textContent=tbPts[t]; pEl.className='point-cell tb';
    } else {
      const pi=pts[t],oi=pts[1-t];
      if(pi!==prevPts[t]) flash('p-'+t); prevPts[t]=pi;
      if(pi===3&&oi===3){ pEl.textContent='ORO'; pEl.className='point-cell oro'; }
      else { pEl.textContent=PTS[pi]||'0'; pEl.className='point-cell normal'; }
    }
  }
  prevTb=st.tiebreak;
});
</script>
</body>
</html>
