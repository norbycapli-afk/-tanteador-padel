<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control Pádel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html,body { height: 100%; overflow: hidden; }
  body { font-family: 'Barlow Condensed', Arial, sans-serif; background: #0a0a14; color: #fff; display: flex; flex-direction: column; }

  .header { background: linear-gradient(90deg,#dc1e28,#b01018); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-title { font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .cancha-badge { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; opacity: 0.9; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b; }
  .conn-dot.ok { background: #4ade80; }

  /* CANCHA SELECTOR */
  .cancha-bar { display: flex; gap: 6px; padding: 8px 10px; background: rgba(0,0,0,0.3); flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.07); overflow-x: auto; }
  .c-btn { border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 800; padding: 6px 14px; cursor: pointer; white-space: nowrap; letter-spacing: 0.5px; transition: all 0.15s; }
  .c-btn.active { background: #dc1e28; border-color: #dc1e28; color: #fff; }

  /* MINI SCORE */
  .mini-score { background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(255,255,255,0.07); padding: 7px 12px; flex-shrink: 0; }
  .tb-ind { text-align: center; color: #c084fc; font-size: 10px; font-weight: 800; letter-spacing: 2px; margin-bottom: 3px; display: none; }
  .ms-row { display: grid; grid-template-columns: 1fr 26px 26px 26px 42px 50px; gap: 3px; align-items: center; padding: 2px 0; }
  .ms-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .ms-srv { width: 6px; height: 6px; border-radius: 50%; background: #f0c040; display: inline-block; opacity: 0; flex-shrink: 0; }
  .ms-srv.vis { opacity: 1; }
  .ms-cell { text-align: center; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.35); }
  .ms-cell.won { color: #fff; }
  .ms-cell.cur { color: rgba(255,255,255,0.7); }
  .ms-game { text-align: center; font-size: 20px; font-weight: 900; color: #fff; background: rgba(255,255,255,0.08); border-radius: 5px; }
  .ms-pt { text-align: center; font-size: 15px; font-weight: 900; color: #f0c040; background: rgba(240,192,64,0.1); border-radius: 5px; }
  .ms-pt.oro { font-size: 11px; }
  .ms-pt.tb { color: #c084fc; background: rgba(168,85,247,0.12); }
  .ms-div { height: 1px; background: rgba(255,255,255,0.05); margin: 2px 0; }

  /* TIMER */
  .timer-bar { background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .timer-display { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .timer-btns { display: flex; gap: 6px; }
  .tbtn { border: none; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; padding: 7px 12px; font-family: inherit; }
  .tbtn-blue { background: #3b82f6; color: #fff; }
  .tbtn-gray { background: rgba(255,255,255,0.12); color: #fff; }

  /* MAIN */
  .main { flex: 1; overflow-y: auto; padding: 8px 8px 4px; display: flex; flex-direction: column; gap: 7px; }

  .team-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .team-panel { background: #13132a; border-radius: 12px; padding: 11px 9px; border: 1px solid rgba(255,255,255,0.07); }
  .tp-name { font-size: 14px; font-weight: 900; text-align: center; margin-bottom: 9px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tp-btn { border: none; border-radius: 10px; font-size: 16px; font-weight: 900; cursor: pointer; padding: 15px 8px; width: 100%; margin-bottom: 6px; font-family: inherit; transition: transform 0.08s, opacity 0.1s; }
  .tp-btn:active { transform: scale(0.93); opacity: 0.8; }
  .tp-btn:last-child { margin-bottom: 0; }
  .btn-green { background: linear-gradient(135deg,#22c55e,#16a34a); color: #fff; }
  .btn-red { background: linear-gradient(135deg,#ef4444,#dc2626); color: #fff; }
  .btn-yellow { background: linear-gradient(135deg,#f0c040,#d4a017); color: #1a1a2e; }

  /* SOUND INDICATOR */
  .sound-bar { display: flex; align-items: center; justify-content: space-between; background: #13132a; border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.07); }
  .sound-label { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }
  .sound-toggle { display: flex; gap: 6px; }
  .stbtn { border: none; border-radius: 7px; font-size: 12px; font-weight: 800; cursor: pointer; padding: 6px 12px; font-family: inherit; transition: all 0.15s; }
  .stbtn.on { background: #22c55e; color: #fff; }
  .stbtn.off { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }

  /* SETTINGS */
  .settings-panel { background: #13132a; border-radius: 12px; padding: 11px; border: 1px solid rgba(255,255,255,0.07); }
  .sp-title { font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 7px; }
  .sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sp-full { grid-column: 1/-1; }
  .sp-label { font-size: 10px; color: rgba(255,255,255,0.35); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .sp-input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; color: #fff; font-size: 13px; font-family: inherit; font-weight: 700; padding: 7px 9px; outline: none; }
  .sp-input:focus { border-color: rgba(240,192,64,0.5); }

  /* QR PANEL */
  .qr-panel { background: #13132a; border-radius: 12px; padding: 11px; border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px; }
  .qr-preview { width: 60px; height: 60px; background: #fff; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .qr-preview img { width: 100%; height: 100%; object-fit: contain; }
  .qr-info { flex: 1; min-width: 0; }
  .qr-info .sp-label { margin-bottom: 5px; }
  .qr-toggle { border: none; border-radius: 7px; font-size: 12px; font-weight: 800; cursor: pointer; padding: 6px 12px; font-family: inherit; margin-top: 5px; }
  .qr-toggle.on { background: #22c55e; color: #fff; }
  .qr-toggle.off { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }

  /* ACTIONS */
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .act-btn { border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; padding: 11px 4px; font-family: inherit; transition: transform 0.08s; }
  .act-btn:active { transform: scale(0.93); }
  .btn-purple { background: linear-gradient(135deg,#a855f7,#9333ea); color: #fff; }
  .btn-slate { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-orange { background: linear-gradient(135deg,#f97316,#ea6608); color: #fff; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">⚡ Control Pádel</div>
    <div class="cancha-badge" id="cancha-badge">CANCHA 1</div>
  </div>
  <div class="conn"><span class="conn-dot" id="conn-dot"></span><span id="conn-txt">Conectando...</span></div>
</div>

<!-- SELECTOR DE CANCHA -->
<div class="cancha-bar" id="cancha-bar">
  <button class="c-btn active" onclick="setCancha(1)">CANCHA 1</button>
  <button class="c-btn" onclick="setCancha(2)">CANCHA 2</button>
  <button class="c-btn" onclick="setCancha(3)">CANCHA 3</button>
  <button class="c-btn" onclick="setCancha(4)">CANCHA 4</button>
</div>

<!-- MINI SCORE -->
<div class="mini-score">
  <div class="tb-ind" id="tb-ind">⬡ TIE-BREAK ACTIVO</div>
  <div class="ms-row">
    <div class="ms-name"><span class="ms-srv" id="srv0"></span><span id="mn0">PAREJA 1</span></div>
    <div class="ms-cell cur" id="ms00">-</div><div class="ms-cell" id="ms10">-</div><div class="ms-cell" id="ms20">-</div>
    <div class="ms-game" id="mg0">0</div><div class="ms-pt" id="mp0">0</div>
  </div>
  <div class="ms-div"></div>
  <div class="ms-row">
    <div class="ms-name"><span class="ms-srv" id="srv1"></span><span id="mn1">PAREJA 2</span></div>
    <div class="ms-cell cur" id="ms01">-</div><div class="ms-cell" id="ms11">-</div><div class="ms-cell" id="ms21">-</div>
    <div class="ms-game" id="mg1">0</div><div class="ms-pt" id="mp1">0</div>
  </div>
</div>

<!-- TIMER -->
<div class="timer-bar">
  <div class="timer-display" id="timer-disp">00:00</div>
  <div class="timer-btns">
    <button class="tbtn tbtn-blue" id="btn-timer" onclick="toggleTimer()">▶ Iniciar</button>
    <button class="tbtn tbtn-gray" onclick="resetTimer()">Reset</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- EQUIPOS -->
  <div class="team-panels">
    <div class="team-panel">
      <div class="tp-name" id="tp-name0">PAREJA 1</div>
      <button class="tp-btn btn-green" onclick="addPoint(0)">+ PUNTO</button>
      <button class="tp-btn btn-red" onclick="subPoint(0)">− PUNTO</button>
      <button class="tp-btn btn-yellow" onclick="setServing(0)">⬡ SAQUE</button>
    </div>
    <div class="team-panel">
      <div class="tp-name" id="tp-name1">PAREJA 2</div>
      <button class="tp-btn btn-green" onclick="addPoint(1)">+ PUNTO</button>
      <button class="tp-btn btn-red" onclick="subPoint(1)">− PUNTO</button>
      <button class="tp-btn btn-yellow" onclick="setServing(1)">⬡ SAQUE</button>
    </div>
  </div>

  <!-- SONIDO -->
  <div class="sound-bar">
    <div class="sound-label">🔊 Sonidos</div>
    <div class="sound-toggle">
      <button class="stbtn on" id="snd-btn" onclick="toggleSound()">Activado</button>
    </div>
  </div>

  <!-- CONFIGURACIÓN -->
  <div class="settings-panel">
    <div class="sp-title">Configuración</div>
    <div class="sp-grid">
      <div><div class="sp-label">Pareja 1</div><input class="sp-input" id="inp0" type="text" placeholder="PAREJA 1" oninput="updateName(0)"></div>
      <div><div class="sp-label">Pareja 2</div><input class="sp-input" id="inp1" type="text" placeholder="PAREJA 2" oninput="updateName(1)"></div>
      <div class="sp-full"><div class="sp-label">Torneo</div><input class="sp-input" id="inpT" type="text" placeholder="TORNEO PADEL TV" oninput="updateTournament()"></div>
      <div class="sp-full"><div class="sp-label">URL Logo (PNG/JPG)</div><input class="sp-input" id="inpLogo" type="text" placeholder="https://..." oninput="updateLogo()"></div>
    </div>
  </div>

  <!-- QR -->
  <div class="qr-panel">
    <div class="qr-preview" id="qr-preview">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" stroke="rgba(0,0,0,0.3)" stroke-width="2"/><rect x="14" y="3" width="7" height="7" stroke="rgba(0,0,0,0.3)" stroke-width="2"/><rect x="3" y="14" width="7" height="7" stroke="rgba(0,0,0,0.3)" stroke-width="2"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z" fill="rgba(0,0,0,0.3)"/></svg>
    </div>
    <div class="qr-info">
      <div class="sp-label">Código QR en overlay</div>
      <input class="sp-input" id="inpQR" type="text" placeholder="URL a mostrar en QR..." oninput="updateQR()" style="margin-bottom:5px">
      <button class="qr-toggle off" id="qr-toggle" onclick="toggleQR()">Mostrar en pantalla</button>
    </div>
  </div>

  <!-- ACCIONES -->
  <div class="actions">
    <button class="act-btn btn-purple" id="btn-tb" onclick="toggleTiebreak()">Tie-break</button>
    <button class="act-btn btn-slate" onclick="resetSet()">Nuevo set</button>
    <button class="act-btn btn-orange" onclick="resetAll()">Reset todo</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLmCZqYxGnheevtj4aY5s3X73FumaW-zc",
  authDomain: "tanteador-padel.firebaseapp.com",
  databaseURL: "https://tanteador-padel-default-rtdb.firebaseio.com",
  projectId: "tanteador-padel",
  storageBucket: "tanteador-padel.firebasestorage.app",
  messagingSenderId: "491608542765",
  appId: "1:491608542765:web:fb42fb877a72ae712d32a4"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const PTS = ['0','15','30','40'];

let local = null, timerInt = null;
let soundOn = true, currentCancha = 1, stRef = null;
let qrVisible = false, qrUrl = '';

const init = () => ({
  names:['PAREJA 1','PAREJA 2'], tournament:'TORNEO PADEL TV', logoUrl:'', qrUrl:'', qrVisible:false,
  pts:[0,0], games:[0,0], sets:[null,null,null],
  curSet:0, serving:0, tiebreak:false, tbPts:[0,0],
  timerRunning:false, timerBase:0, timerStarted:null
});

function push(st){ if(stRef) set(stRef, st); }
function getState(){ return local ? JSON.parse(JSON.stringify(local)) : init(); }

// --- AUDIO ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function getACtx(){ if(!actx) actx = new AudioCtx(); return actx; }

function playTone(freq, dur, type='sine', vol=0.3){
  if(!soundOn) return;
  try {
    const ctx = getACtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e){}
}
function soundPoint(){ playTone(880, 0.12, 'sine', 0.25); }
function soundGame(){
  playTone(660, 0.1, 'sine', 0.3);
  setTimeout(()=>playTone(880, 0.15, 'sine', 0.3), 120);
  setTimeout(()=>playTone(1100, 0.25, 'sine', 0.3), 260);
}
function soundSet(){
  [440,550,660,880].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'sine',0.35),i*100));
}
function soundOro(){
  playTone(740, 0.08, 'sine', 0.3);
  setTimeout(()=>playTone(740, 0.25, 'sine', 0.3), 100);
}

window.toggleSound = ()=>{
  soundOn=!soundOn;
  const btn=document.getElementById('snd-btn');
  btn.textContent=soundOn?'Activado':'Desactivado';
  btn.className=soundOn?'stbtn on':'stbtn off';
};

// --- CANCHA ---
window.setCancha = n => {
  currentCancha = n;
  document.querySelectorAll('.c-btn').forEach((b,i)=>b.className='c-btn'+(i+1===n?' active':''));
  document.getElementById('cancha-badge').textContent='CANCHA '+n;
  listenCancha();
};

function listenCancha(){
  if(stRef) off(stRef);
  stRef = ref(db, 'cancha'+currentCancha+'/estado');
  local = null;
  onValue(stRef, snap => {
    const d = snap.val();
    local = d || init();
    if(!d) push(local);
    renderUI(local);
    document.getElementById('conn-dot').className='conn-dot ok';
    document.getElementById('conn-txt').textContent='Conectado';
  }, ()=>{ document.getElementById('conn-txt').textContent='Sin conexión'; });
}

// --- RENDER ---
function renderUI(st){
  ['inp0','inp1'].forEach((id,i)=>{ const el=document.getElementById(id); if(document.activeElement!==el) el.value=(st.names&&st.names[i])||''; });
  ['inpT','inpLogo','inpQR'].forEach((id,i)=>{ const el=document.getElementById(id); if(document.activeElement!==el){ if(i===0) el.value=st.tournament||''; else if(i===1) el.value=st.logoUrl||''; else el.value=st.qrUrl||''; } });

  document.getElementById('tp-name0').textContent=(st.names&&st.names[0])||'PAREJA 1';
  document.getElementById('tp-name1').textContent=(st.names&&st.names[1])||'PAREJA 2';
  document.getElementById('mn0').textContent=(st.names&&st.names[0])||'PAREJA 1';
  document.getElementById('mn1').textContent=(st.names&&st.names[1])||'PAREJA 2';

  const srv=st.serving||0;
  document.getElementById('srv0').className='ms-srv'+(srv===0?' vis':'');
  document.getElementById('srv1').className='ms-srv'+(srv===1?' vis':'');

  document.getElementById('tb-ind').style.display=st.tiebreak?'block':'none';
  document.getElementById('btn-tb').textContent=st.tiebreak?'Salir TB':'Tie-break';
  document.getElementById('btn-tb').className=st.tiebreak?'act-btn btn-slate':'act-btn btn-purple';

  // QR toggle
  const qtBtn=document.getElementById('qr-toggle');
  qtBtn.textContent=st.qrVisible?'Ocultar QR':'Mostrar en pantalla';
  qtBtn.className=st.qrVisible?'qr-toggle on':'qr-toggle off';
  if(st.qrUrl){
    const qrSrc=`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(st.qrUrl)}`;
    document.getElementById('qr-preview').innerHTML=`<img src="${qrSrc}" alt="QR">`;
  }

  const sets=st.sets||[null,null,null], curSet=st.curSet||0;
  const games=st.games||[0,0], tbPts=st.tbPts||[0,0], pts=st.pts||[0,0];

  for(let t=0;t<2;t++){
    for(let s=0;s<3;s++){
      const el=document.getElementById('ms'+s+''+t);
      if(sets[s]){ el.textContent=sets[s][t]; el.className='ms-cell'+(sets[s][t]>sets[s][1-t]?' won':''); }
      else if(s===curSet){ el.textContent=games[t]; el.className='ms-cell cur'; }
      else { el.textContent='-'; el.className='ms-cell'; }
    }
    document.getElementById('mg'+t).textContent=st.tiebreak?tbPts[t]:games[t];
    const pEl=document.getElementById('mp'+t);
    if(st.tiebreak){ pEl.textContent=tbPts[t]; pEl.className='ms-pt tb'; }
    else {
      const pi=pts[t],oi=pts[1-t];
      if(pi===3&&oi===3){ pEl.textContent='ORO'; pEl.className='ms-pt oro'; }
      else { pEl.textContent=PTS[pi]||'0'; pEl.className='ms-pt'; }
    }
  }

  clearInterval(timerInt);
  if(st.timerRunning){
    const base=st.timerBase||0, started=st.timerStarted||Date.now();
    const upd=()=>{ const e=base+Math.floor((Date.now()-started)/1000); document.getElementById('timer-disp').textContent=Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0'); };
    upd(); timerInt=setInterval(upd,500);
    document.getElementById('btn-timer').textContent='⏸ Pausar';
  } else {
    const s=st.timerBase||0; document.getElementById('timer-disp').textContent=Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');
    document.getElementById('btn-timer').textContent='▶ Iniciar';
  }
}

// --- ACCIONES ---
window.updateName = t=>{ const st=getState(); st.names[t]=(document.getElementById('inp'+t).value||'PAREJA '+(t+1)).toUpperCase(); push(st); };
window.updateTournament = ()=>{ const st=getState(); st.tournament=(document.getElementById('inpT').value||'TORNEO PADEL TV').toUpperCase(); push(st); };
window.updateLogo = ()=>{ const st=getState(); st.logoUrl=document.getElementById('inpLogo').value.trim(); push(st); };
window.updateQR = ()=>{ const st=getState(); st.qrUrl=document.getElementById('inpQR').value.trim(); push(st); };
window.toggleQR = ()=>{ const st=getState(); st.qrVisible=!st.qrVisible; push(st); };
window.setServing = t=>{ const st=getState(); st.serving=t; push(st); };

window.addPoint = t=>{
  const st=getState();
  if(st.tiebreak){ const before=[...st.tbPts]; addTBPt(st,t); if(st.tbPts[t]!==before[t]) soundPoint(); push(st); return; }
  const pi=st.pts[t], oi=st.pts[1-t];
  if(pi===3&&oi===3){ soundOro(); winGame(st,t); }
  else if(pi===3){ soundGame(); winGame(st,t); }
  else { soundPoint(); st.pts[t]++; }
  push(st);
};
window.subPoint = t=>{
  const st=getState();
  if(st.tiebreak){ if(st.tbPts[t]>0)st.tbPts[t]--; push(st); return; }
  if(st.pts[t]>0)st.pts[t]--;
  push(st);
};

function addTBPt(st,t){
  st.tbPts[t]++;
  const [a,b]=st.tbPts;
  if((a>=7||b>=7)&&Math.abs(a-b)>=2){
    soundSet(); st.games[t]++; st.tiebreak=false; st.tbPts=[0,0]; st.pts=[0,0];
    st.sets[st.curSet]=[...st.games]; st.games=[0,0];
    if(st.curSet<2)st.curSet++;
  }
}
function winGame(st,t){
  const prevSets=st.sets.filter(s=>s).length;
  st.pts=[0,0]; st.games[t]++;
  const [a,b]=st.games;
  if((a>=6&&a-b>=2)||(a===7&&b===6)||(b>=6&&b-a>=2)||(b===7&&a===6)){
    soundSet(); st.sets[st.curSet]=[...st.games]; st.games=[0,0]; st.tiebreak=false;
    if(st.curSet<2)st.curSet++;
  }
  if(st.games[0]===6&&st.games[1]===6){ st.tiebreak=true; st.tbPts=[0,0]; }
}

window.toggleTiebreak = ()=>{ const st=getState(); st.tiebreak=!st.tiebreak; if(st.tiebreak){st.tbPts=[0,0];st.pts=[0,0];}else{st.pts=[0,0];} push(st); };
window.resetSet = ()=>{ const st=getState(); st.sets[st.curSet]=[...st.games]; st.games=[0,0]; st.pts=[0,0]; st.tiebreak=false; st.tbPts=[0,0]; if(st.curSet<2)st.curSet++; push(st); };
window.resetAll = ()=>{ if(!confirm('¿Resetear todo el partido?'))return; push(init()); };
window.toggleTimer = ()=>{
  const st=getState();
  if(st.timerRunning){ st.timerBase=(st.timerBase||0)+Math.floor((Date.now()-(st.timerStarted||Date.now()))/1000); st.timerRunning=false; st.timerStarted=null; }
  else { st.timerRunning=true; st.timerStarted=Date.now(); }
  push(st);
};
window.resetTimer = ()=>{ const st=getState(); st.timerRunning=false; st.timerBase=0; st.timerStarted=null; push(st); };

// Iniciar
listenCancha();
</script>
