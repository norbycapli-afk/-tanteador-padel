<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: transparent; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; }

  .overlay {
    background: rgba(0,0,0,0.82);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 20px;
    width: 720px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .tournament-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .tournament-name { color: #f0c040; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .match-time { color: #fff; font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.08); padding: 3px 10px; border-radius: 6px; }
  .time-live { display: inline-block; width: 8px; height: 8px; background: #ff3b3b; border-radius: 50%; margin-right: 6px; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }

  .tb-badge { text-align: center; color: #c084fc; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 4px 0 2px; display: none; }

  .sets-header {
    display: grid;
    grid-template-columns: 1fr 36px 36px 36px 64px 72px;
    gap: 4px; padding: 0 10px 4px;
  }
  .sets-header span { color: rgba(255,255,255,0.3); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; }

  .team-row {
    display: grid;
    grid-template-columns: 1fr 36px 36px 36px 64px 72px;
    align-items: center; gap: 4px;
    padding: 8px 10px; border-radius: 8px;
  }
  .team-row.serving { background: rgba(255,255,255,0.06); }
  .team-name { color: #fff; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .serving-dot { width: 8px; height: 8px; background: #f0c040; border-radius: 50%; display: inline-block; margin-right: 8px; visibility: hidden; }
  .team-row.serving .serving-dot { visibility: visible; }
  .set-cell { text-align: center; color: rgba(255,255,255,0.4); font-size: 16px; font-weight: 600; }
  .set-cell.won { color: #fff; }
  .set-cell.cur { color: rgba(255,255,255,0.6); font-size: 18px; }
  .game-cell { text-align: center; color: #fff; font-size: 30px; font-weight: 800; background: rgba(255,255,255,0.1); border-radius: 6px; padding: 4px 0; }
  .point-cell { text-align: center; color: #f0c040; font-size: 26px; font-weight: 800; background: rgba(240,192,64,0.12); border: 1px solid rgba(240,192,64,0.25); border-radius: 6px; padding: 4px 0; }
  .point-cell.oro { color: #f0c040; background: rgba(240,192,64,0.2); border-color: rgba(240,192,64,0.5); font-size: 18px; }
  .point-cell.tb { color: #c084fc; background: rgba(192,132,252,0.12); border-color: rgba(192,132,252,0.3); }
</style>
</head>
<body>
<div class="overlay">
  <div class="tournament-bar">
    <span class="tournament-name" id="disp-tournament">TORNEO PADEL TV</span>
    <span class="match-time"><span class="time-live" id="live-dot" style="display:none"></span><span id="disp-time">00:00</span></span>
  </div>
  <div class="tb-badge" id="tb-badge">⬡ TIE-BREAK</div>
  <div class="sets-header">
    <span></span><span>S1</span><span>S2</span><span>S3</span><span>GAME</span><span>PUNTO</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <div class="team-row serving" id="row-0">
      <div class="team-name"><span class="serving-dot"></span><span id="disp-name-0">PAREJA 1</span></div>
      <div class="set-cell cur" id="s0-0">-</div><div class="set-cell" id="s1-0">-</div><div class="set-cell" id="s2-0">-</div>
      <div class="game-cell" id="g-0">0</div>
      <div class="point-cell" id="p-0">0</div>
    </div>
    <div class="team-row" id="row-1">
      <div class="team-name"><span class="serving-dot"></span><span id="disp-name-1">PAREJA 2</span></div>
      <div class="set-cell cur" id="s0-1">-</div><div class="set-cell" id="s1-1">-</div><div class="set-cell" id="s2-1">-</div>
      <div class="game-cell" id="g-1">0</div>
      <div class="point-cell" id="p-1">0</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLmCZqYxGnheevtj4aY5s3X73FumaW-zc",
  authDomain: "tanteador-padel.firebaseapp.com",
  databaseURL: "https://tanteador-padel-default-rtdb.firebaseio.com",
  projectId: "tanteador-padel",
  storageBucket: "tanteador-padel.firebasestorage.app",
  messagingSenderId: "491608542765",
  appId: "1:491608542765:web:fb42fb877a72ae712d32a4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const PTS = ['0','15','30','40'];

let timerInt = null;

onValue(ref(db, 'estado'), snap => {
  const st = snap.val();
  if(!st) return;

  // Torneo
  document.getElementById('disp-tournament').textContent = (st.tournament||'TORNEO PADEL TV').toUpperCase();

  // Timer
  clearInterval(timerInt);
  if(st.timerRunning){
    const base = st.timerBase || 0;
    const started = st.timerStarted || Date.now();
    const update = () => {
      const elapsed = base + Math.floor((Date.now() - started)/1000);
      const m = Math.floor(elapsed/60).toString().padStart(2,'0');
      const s = (elapsed%60).toString().padStart(2,'0');
      document.getElementById('disp-time').textContent = m+':'+s;
    };
    update(); timerInt = setInterval(update, 500);
    document.getElementById('live-dot').style.display = 'inline-block';
  } else {
    const secs = st.timerBase || 0;
    const m = Math.floor(secs/60).toString().padStart(2,'0');
    const s = (secs%60).toString().padStart(2,'0');
    document.getElementById('disp-time').textContent = m+':'+s;
    document.getElementById('live-dot').style.display = 'none';
  }

  // Nombres
  document.getElementById('disp-name-0').textContent = (st.names&&st.names[0])||'PAREJA 1';
  document.getElementById('disp-name-1').textContent = (st.names&&st.names[1])||'PAREJA 2';

  // Saque
  const srv = st.serving||0;
  document.getElementById('row-0').className = 'team-row'+(srv===0?' serving':'');
  document.getElementById('row-1').className = 'team-row'+(srv===1?' serving':'');

  // TB badge
  document.getElementById('tb-badge').style.display = st.tiebreak ? 'block' : 'none';

  // Sets y games
  const sets = st.sets || [null,null,null];
  const curSet = st.curSet || 0;
  const games = st.games || [0,0];
  const tbPts = st.tbPts || [0,0];

  for(let t=0;t<2;t++){
    for(let s=0;s<3;s++){
      const el = document.getElementById('s'+s+'-'+t);
      if(sets[s]){
        el.textContent = sets[s][t];
        el.className = 'set-cell'+(sets[s][t]>sets[s][1-t]?' won':'');
      } else if(s===curSet){
        el.textContent = st.tiebreak ? games[t] : games[t];
        el.className = 'set-cell cur';
      } else {
        el.textContent = '-'; el.className = 'set-cell';
      }
    }
    document.getElementById('g-'+t).textContent = st.tiebreak ? tbPts[t] : games[t];

    // Puntos
    const pEl = document.getElementById('p-'+t);
    const pts = st.pts || [0,0];
    if(st.tiebreak){
      pEl.textContent = tbPts[t]; pEl.className = 'point-cell tb';
    } else {
      const pi = pts[t], oi = pts[1-t];
      if(pi===3 && oi===3){ pEl.textContent='ORO'; pEl.className='point-cell oro'; }
      else { pEl.textContent = PTS[pi]||'0'; pEl.className='point-cell'; }
    }
  }
});
</script>
</body>
</html>
